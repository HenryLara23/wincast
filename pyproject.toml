[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wincast"
dynamic = ["version"]
description = "Live win-chance overlay for Summoner's Rift. Local only, no API key."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]          # the overlay (Phase 6)
dev = ["pytest>=7"]
build = ["pyinstaller>=6.6"]      # tools/build_exe.py

[project.scripts]
wincast = "wincast.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "wincast.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wincast = ["resources/**/*.json", "resources/*.pem"]
lolwp = ["CORE_MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
